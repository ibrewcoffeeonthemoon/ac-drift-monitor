[App]
height=160 ; App height (specifies height of the app in pixel); from 60 to 500
bg_opacity=0.2 ; App background opacity (level of transparent); from 0.05 to 1.0

[SlipRatioMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=0; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4

[GForceMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=1; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4
box_size=0.1 ; Square dot size (size in terms of percentage height); from 0.01 to 0.5
gforce_scale=1.2 ; Gforce scale (higher value gives less movement); from 0.1 to 5.0
slip_ratio_enabled=True ; Show rear slip ratio (enable or disable this indicator); True or False
slip_ratio_scale=1.5; Slip ratio scale (higher value gives less movement); from 0.1 to 5.0

[SlipAngleMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=2; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4
sensitivity=1.5 ; Sensitivity (higher value gives faster rotation); from 0.1 to 5.0
wheel_degree=900 ; Wheel degree (wheel maximum rotation degree); from 40 to 1180 

[SpeedMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=3; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4

[GearMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=4; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4

[PedalsMonitor]
enabled=True; Enable (enable or disable this monitor); True or False
col_index=5; Column index (larger index position monitor to the right); 0, 1, 2, 3, 4, 5
col_span=2 ; Column span (width in terms of column unit); 1, 2, 3, 4

